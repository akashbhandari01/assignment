{% extends "base.html" %}
{% block title %}Add New User{% endblock %}
{% block content %}
<h2>Add New User</h2>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="POST">
  {% csrf_token %}
  <div class="mb-3"><label>Name</label><input name="name" class="form-control"></div>
  <div class="mb-3"><label>Email</label><input name="email" class="form-control"></div>
  <div class="mb-3"><label>Role</label><input name="role" class="form-control"></div>
  <button class="btn btn-success">Submit</button>
</form>
{% endblock %}
